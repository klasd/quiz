<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famous Persons Quiz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface2:  #263348;
      --border:    #334155;
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --green:     #22c55e;
      --green-dim: rgba(34,197,94,0.15);
      --red:       #ef4444;
      --red-dim:   rgba(239,68,68,0.15);
      --accent:    #6366f1;
      --radius:    12px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      overflow: hidden; }

    #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .hidden { display: none !important; }

    /* ── START SCREEN ── */
    #start-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px; text-align: center;
    }
    .globe { font-size: 72px; margin-bottom: 18px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    #start-screen h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; margin-bottom: 10px;
      background: linear-gradient(135deg, #e2e8f0 30%, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #start-screen p { color: var(--muted); font-size: .95rem; max-width: 380px; margin-bottom: 28px; line-height: 1.55; }

    .stats-row { display: flex; gap: 12px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 20px; text-align: center; min-width: 80px; }
    .stat-num  { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .stat-lbl  { font-size: .7rem; color: var(--muted); margin-top: 2px; }

    .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      padding: 14px 48px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: background .15s, transform .12s; }
    .btn-primary:hover  { background: #4f46e5; transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }

    /* category grid on start screen */
    #cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 22px;
    }
    .cat-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid;
      border-radius: 9px;
      padding: 10px 6px 8px;
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }
    .cat-card-icon { font-size: 1.4rem; line-height: 1; }
    .cat-card-name { color: var(--text); font-size: .72rem; }
    .cat-card-count { font-size: .68rem; color: var(--muted); }

    /* ── QUIZ SCREEN ── */
    #quiz-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100vh; }

    #quiz-header {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #progress-text { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    #progress-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    #progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; width: 0%; }
    #score-display { font-size: .85rem; font-weight: 700; white-space: nowrap; }

    #map-wrapper { position: relative; flex: 1; min-height: 0; }
    #map { width: 100%; height: 100%; }

    #map-legend {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,.88); border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 14px; font-size: .78rem; display: flex; gap: 14px; z-index: 1000;
      backdrop-filter: blur(4px); pointer-events: none;
    }
    .leg-item { display: flex; align-items: center; gap: 6px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .leg-dot.g { background: var(--green); }
    .leg-dot.r { background: var(--red); }
    .leg-dot.dual-legend { animation: dual-dot 4s ease-in-out infinite; }

    /* bottom panel: swaps between question-panel and fact-card */
    #bottom-panel {
      background: var(--surface); border-top: 1px solid var(--border);
      flex-shrink: 0; position: relative;
    }
    #question-panel, #fact-card {
      padding: 10px 13px 12px;
    }

    #clue-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
    .cat-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem;
      font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; }
    .era-hint { font-size: .78rem; color: var(--muted); }

    #options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .opt-btn {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 8px; font-size: .82rem; font-weight: 500;
      cursor: pointer; transition: background .13s, border-color .13s, transform .09s;
      text-align: left; line-height: 1.25; min-height: 48px;
    }
    .opt-btn:hover:not(:disabled) { background: #2d3f58; border-color: var(--accent); }
    .opt-btn:active:not(:disabled) { transform: scale(.97); }
    .opt-btn.correct  { background: var(--green-dim); border-color: var(--green); color: var(--green); font-weight: 700; }
    .opt-btn.wrong    { background: var(--red-dim);   border-color: var(--red);   color: var(--red);   font-weight: 700; }
    .opt-btn:disabled { cursor: default; }

    /* fact card */
    #result-line { font-size: .82rem; font-weight: 700; margin-bottom: 5px; }
    #result-line.ok  { color: var(--green); }
    #result-line.bad { color: var(--red); }
    #fact-name { font-size: 1.05rem; font-weight: 800; margin-bottom: 3px; }
    #fact-dates { font-size: .76rem; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
    #fact-text {
      font-size: .79rem; color: var(--text); line-height: 1.5;
      padding: 7px 10px; background: var(--surface2); border-radius: 8px;
      border-left: 3px solid var(--accent); margin-bottom: 9px;
    }
    #next-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 9px; padding: 11px; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    #next-btn:hover { background: #4f46e5; }

    /* ── RESULTS SCREEN ── */
    #results-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    #results-header { padding: 24px 20px 12px; text-align: center; flex-shrink: 0; }
    #results-header h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    #final-score { font-size: 3.2rem; font-weight: 900; color: var(--accent); }
    #score-msg { color: var(--muted); font-size: .88rem; margin-top: 4px; }
    #results-list { flex: 1; overflow-y: auto; padding: 0 14px 8px; }
    .res-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 9px; margin-bottom: 7px;
    }
    .res-icon { font-size: 1rem; flex-shrink: 0; }
    .res-name { font-size: .88rem; font-weight: 600; flex: 1; }
    .res-cat  { font-size: .7rem; color: var(--muted); }
    #results-footer { padding: 14px; flex-shrink: 0; }

    /* ── MAP MARKERS ── */
    .pulse-marker { position: relative; width: 14px; height: 14px; }
    .p-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.85); position: absolute; }
    .p-ring { width: 14px; height: 14px; border-radius: 50%; position: absolute; animation: pulse 2s ease-out infinite; }
    .p-green { background: #22c55e; }
    .p-green-ring { background: rgba(34,197,94,.55); }
    .p-red { background: #ef4444; }
    .p-red-ring { background: rgba(239,68,68,.55); }
    @keyframes pulse { 0%{transform:scale(1);opacity:.8} 100%{transform:scale(3.8);opacity:0} }

    /* ── DUAL MARKER (born & died in same place) ── */
    .dual-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.85); position: absolute;
      animation: dual-dot 4s ease-in-out infinite;
    }
    .dual-ring {
      width: 14px; height: 14px; border-radius: 50%; position: absolute;
      animation: dual-ring 4s ease-in-out infinite;
    }
    @keyframes dual-dot {
      0%, 47%  { background: #22c55e; }
      50%, 97% { background: #ef4444; }
      100%     { background: #22c55e; }
    }
    @keyframes dual-ring {
      0%   { transform:scale(1);   opacity:.8; background:rgba(34,197,94,.55);  }
      42%  { transform:scale(3.8); opacity:0;  background:rgba(34,197,94,.55);  }
      43%  { transform:scale(1);   opacity:0;  background:rgba(239,68,68,.55); }
      50%  { transform:scale(1);   opacity:.8; background:rgba(239,68,68,.55); }
      92%  { transform:scale(3.8); opacity:0;  background:rgba(239,68,68,.55); }
      93%  { transform:scale(1);   opacity:0;  background:rgba(34,197,94,.55);  }
      100% { transform:scale(1);   opacity:.8; background:rgba(34,197,94,.55);  }
    }

    /* leaflet overrides */
    .leaflet-control-zoom a { background: var(--surface); color: var(--text); border-color: var(--border); }
    .leaflet-control-zoom a:hover { background: var(--surface2); }
    .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
    .leaflet-popup-tip { background: var(--surface); }
    .leaflet-popup-content { margin: 8px 12px; font-size: .8rem; line-height: 1.5; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== START SCREEN ===== -->
  <div id="start-screen">
    <div class="globe">🌍</div>
    <h1>Famous Persons Quiz</h1>
    <p>A <strong style="color:var(--green)">green dot</strong> marks where they were born.
       A <strong style="color:var(--red)">red dot</strong> marks where they died.
       Can you guess who it is?</p>

    <div id="cat-grid"></div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-people">236</div><div class="stat-lbl">People</div></div>
      <div class="stat-card"><div class="stat-num">6</div><div class="stat-lbl">Categories</div></div>
      <div class="stat-card"><div class="stat-num">12</div><div class="stat-lbl">Questions</div></div>
    </div>
    <button class="btn-primary" id="start-btn">Start Quiz</button>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="quiz-screen" class="hidden">

    <div id="quiz-header">
      <span id="progress-text">1 / 12</span>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <span id="score-display">Score: 0</span>
    </div>

    <div id="map-wrapper">
      <div id="map"></div>
      <div id="map-legend">
        <div class="leg-item"><div class="leg-dot g"></div><span>Birthplace</span></div>
        <div class="leg-item"><div class="leg-dot r"></div><span>Death place</span></div>
        <div class="leg-item"><div class="leg-dot dual-legend"></div><span>Born &amp; died here</span></div>
      </div>
    </div>

    <div id="bottom-panel">
      <!-- Question panel -->
      <div id="question-panel">
        <div id="clue-bar">
          <span class="cat-badge" id="cat-badge"></span>
          <span class="era-hint" id="era-hint"></span>
        </div>
        <div id="options-grid">
          <button class="opt-btn" data-i="0"></button>
          <button class="opt-btn" data-i="1"></button>
          <button class="opt-btn" data-i="2"></button>
          <button class="opt-btn" data-i="3"></button>
        </div>
      </div>

      <!-- Fact card (shown after answering) -->
      <div id="fact-card" class="hidden">
        <div id="result-line"></div>
        <div id="fact-name"></div>
        <div id="fact-dates"></div>
        <div id="fact-text"></div>
        <button id="next-btn">Next →</button>
      </div>
    </div>

  </div>

  <!-- ===== RESULTS SCREEN ===== -->
  <div id="results-screen" class="hidden">
    <div id="results-header">
      <h2>Quiz Complete!</h2>
      <div id="final-score"></div>
      <div id="score-msg"></div>
    </div>
    <div id="results-list"></div>
    <div id="results-footer">
      <button class="btn-primary" id="restart-btn" style="width:100%">Play Again</button>
    </div>
  </div>

</div><!-- #app -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

//  DATA  –  202 famous deceased people

    died:{city:"Geneva, Switzerland",         lat:46.2044,  lng:6.1432,    yr:1986},
    fact:"Argentine master of the short story whose labyrinths and fantastical fictions invented a wholly new kind of literature." },
];

// ─────────────────────────────────────────────
//  CATEGORY STYLES
// ─────────────────────────────────────────────
const CAT = {
  Scientist:  { color:"#06b6d4", bg:"rgba(6,182,212,.12)",   icon:"🔬" },
  Artist:     { color:"#f59e0b", bg:"rgba(245,158,11,.12)",  icon:"🎨" },
  Author:     { color:"#fb7185", bg:"rgba(251,113,133,.12)", icon:"📖" },
  Politician: { color:"#a78bfa", bg:"rgba(167,139,250,.12)", icon:"⚔️"  },
  Explorer:   { color:"#fb923c", bg:"rgba(251,146,60,.12)",  icon:"🧭" },
  Composer:   { color:"#f472b6", bg:"rgba(244,114,182,.12)", icon:"🎵" },
  Philosopher:{ color:"#2dd4bf", bg:"rgba(45,212,191,.12)",  icon:"📜" },
};

// ─────────────────────────────────────────────
//  QUIZ STATE
// ─────────────────────────────────────────────
const ROUND_SIZE = 12;
let questions  = [];   // shuffled subset
let current    = 0;
let score      = 0;
let history    = [];   // { person, chosen, correct }
let answered   = false;
let options    = [];   // [person, ...]  length 4

// ─────────────────────────────────────────────
//  MAP
// ─────────────────────────────────────────────
let map, bMarker, dMarker;

function initMap() {
  map = L.map("map", {
    center: [20, 15], zoom: 2,
    zoomControl: true,
    attributionControl: false,
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd", maxZoom: 18,
  }).addTo(map);

  L.control.attribution({ prefix: false })
    .addAttribution('© <a href="https://carto.com/">CARTO</a> | © <a href="https://openstreetmap.org">OSM</a>')
    .addTo(map);
}

function makeIcon(type) {
  const cls = type === "birth" ? "p-green p-dot" : "p-red p-dot";
  const rcls = type === "birth" ? "p-green-ring p-ring" : "p-red-ring p-ring";
  return L.divIcon({
    className: "",
    html: `<div class="pulse-marker"><div class="${cls}"></div><div class="${rcls}"></div></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -12],
  });
}

function placeMarkers(person) {
  if (bMarker) { bMarker.remove(); bMarker = null; }
  if (dMarker) { dMarker.remove(); dMarker = null; }

  const b = person.born, d = person.died;
  const samePlace = Math.abs(b.lat - d.lat) < 0.15 && Math.abs(b.lng - d.lng) < 0.15;

  if (samePlace) {
    // Single marker pulsing green → red to show born & died in same city
    const dualIcon = L.divIcon({
      className: "",
      html: `<div class="pulse-marker"><div class="dual-dot"></div><div class="dual-ring"></div></div>`,
      iconSize: [14, 14], iconAnchor: [7, 7], tooltipAnchor: [0, -12],
    });
    bMarker = L.marker([b.lat, b.lng], { icon: dualIcon }).addTo(map);
    bMarker.bindTooltip(
      `<b>Born &amp; Died here</b><br>${b.city}<br>` +
      `<i>Born ${formatYear(b.yr)} · Died ${formatYear(d.yr)}</i>`,
      { permanent: true, direction: "top" }
    );
    map.setView([b.lat, b.lng], 6);
  } else {
    bMarker = L.marker([b.lat, b.lng], { icon: makeIcon("birth") }).addTo(map);
    dMarker = L.marker([d.lat, d.lng], { icon: makeIcon("death") }).addTo(map);

    // Point each tooltip away from the other marker so they never overlap.
    // Prefer the vertical (lat) axis; fall back to horizontal when markers
    // are nearly on the same latitude line.
    const latDiff = b.lat - d.lat;
    const lngDiff = b.lng - d.lng;
    let bDir, dDir;
    if (Math.abs(latDiff) >= 2) {
      bDir = latDiff > 0 ? "top" : "bottom";
      dDir = latDiff > 0 ? "bottom" : "top";
    } else {
      bDir = lngDiff < 0 ? "right" : "left";
      dDir = lngDiff < 0 ? "left" : "right";
    }

    bMarker.bindTooltip(`<b>Birthplace</b><br>${b.city}<br><i>${formatYear(b.yr)}</i>`, { permanent: true, direction: bDir });
    dMarker.bindTooltip(`<b>Death place</b><br>${d.city}<br><i>${formatYear(d.yr)}</i>`, { permanent: true, direction: dDir });

    const bounds = L.latLngBounds([[b.lat, b.lng], [d.lat, d.lng]]);
    // Extra padding gives tooltip labels room so they don't get clipped at the map edge.
    // Vertical padding (100 px) > tooltip height (~65 px); horizontal (80 px) > tooltip width.
    map.fitBounds(bounds, { padding: [100, 80], maxZoom: 8 });
  }
}

function lockMap() {
  map.dragging.disable();
  map.touchZoom.disable();
  map.doubleClickZoom.disable();
  map.scrollWheelZoom.disable();
  map.keyboard.disable();
  map.boxZoom.disable();
}

function unlockMap() {
  map.dragging.enable();
  map.touchZoom.enable();
  map.doubleClickZoom.enable();
  map.scrollWheelZoom.enable();
  map.keyboard.enable();
  map.boxZoom.enable();
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatYear(yr) {
  if (yr < 0) return `${Math.abs(yr)} BC`;
  return String(yr);
}

function eraHint(yr) {
  if (yr < -500)  return `Born c.${Math.abs(yr)} BC`;
  if (yr < 0)     return `Born ${Math.abs(yr)} BC`;
  if (yr < 1000)  return `Born ${yr} AD`;
  const dec = Math.floor(yr / 10) * 10;
  return `Born in the ${dec}s`;
}

// Generate 4 options: 1 correct + 3 weighted wrong
function generateOptions(correct, pool) {
  const others = pool.filter(p => p.name !== correct.name);
  const scored = others.map(p => ({
    p,
    s: (p.cat === correct.cat ? 2 : 0) +
       (Math.abs(p.born.yr - correct.born.yr) < 150 ? 1 : 0) +
       Math.random() * 1.2,
  }));
  scored.sort((a, b) => b.s - a.s);
  const wrongs = scored.slice(0, 3).map(x => x.p);
  return shuffle([correct, ...wrongs]);
}

// ─────────────────────────────────────────────
//  QUIZ FLOW
// ─────────────────────────────────────────────
function startQuiz() {
  questions = shuffle(PEOPLE).slice(0, ROUND_SIZE);
  current = 0; score = 0; history = [];
  show("quiz-screen");
  // Map div must be visible before Leaflet can measure it.
  // Delay showQuestion until after initMap() has run.
  if (!map) {
    setTimeout(() => { initMap(); showQuestion(); }, 60);
  } else {
    map.invalidateSize();
    showQuestion();
  }
}

function showQuestion() {
  answered = false;
  const person = questions[current];
  options = generateOptions(person, PEOPLE);

  // Header
  document.getElementById("progress-text").textContent = `${current + 1} / ${ROUND_SIZE}`;
  document.getElementById("progress-bar").style.width = `${(current / ROUND_SIZE) * 100}%`;
  document.getElementById("score-display").textContent = `Score: ${score}`;

  // Clue
  const cs = CAT[person.cat];
  const badge = document.getElementById("cat-badge");
  badge.textContent = `${cs.icon} ${person.cat}`;
  badge.style.color = cs.color;
  badge.style.borderColor = cs.color;
  badge.style.background = cs.bg;
  document.getElementById("era-hint").textContent = eraHint(person.born.yr);

  // Buttons
  const btns = document.querySelectorAll(".opt-btn");
  btns.forEach((btn, i) => {
    btn.textContent = options[i].name;
    btn.className = "opt-btn";
    btn.disabled = false;
    btn.onclick = () => handleAnswer(i);
  });

  // Map
  placeMarkers(person);
  lockMap();

  // Panels
  document.getElementById("question-panel").classList.remove("hidden");
  document.getElementById("fact-card").classList.add("hidden");
}

function handleAnswer(idx) {
  if (answered) return;
  answered = true;

  const person = questions[current];
  const chosen = options[idx];
  const correct = chosen.name === person.name;
  if (correct) score++;
  history.push({ person, chosen, correct });

  // Colour buttons
  const btns = document.querySelectorAll(".opt-btn");
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (options[i].name === person.name) btn.classList.add("correct");
    else if (i === idx && !correct)      btn.classList.add("wrong");
  });

  // Show fact card
  const rl = document.getElementById("result-line");
  rl.textContent = correct ? "✓ Correct!" : `✗ It was ${person.name}`;
  rl.className = correct ? "ok" : "bad";
  rl.classList.remove("hidden");

  document.getElementById("fact-name").textContent = person.name;

  const cs = CAT[person.cat];
  document.getElementById("fact-dates").innerHTML =
    `<span class="cat-badge" style="color:${cs.color};border-color:${cs.color};background:${cs.bg}">${cs.icon} ${person.cat}</span>&nbsp; ` +
    `Born: ${person.born.city} (${formatYear(person.born.yr)}) &nbsp;·&nbsp; ` +
    `Died: ${person.died.city} (${formatYear(person.died.yr)})`;

  document.getElementById("fact-text").textContent = person.fact;

  const isLast = current === ROUND_SIZE - 1;
  document.getElementById("next-btn").textContent = isLast ? "See Results →" : "Next →";

  document.getElementById("question-panel").classList.add("hidden");
  document.getElementById("fact-card").classList.remove("hidden");

  unlockMap();
}

function nextQuestion() {
  current++;
  if (current >= ROUND_SIZE) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  document.getElementById("progress-bar").style.width = "100%";

  const pct = score / ROUND_SIZE;
  const msgs = [
    [1.00, "Perfect! You're a true scholar of history! 🏆"],
    [0.85, "Excellent! Impressive historical knowledge!"],
    [0.70, "Well done! You know your famous figures."],
    [0.50, "Not bad! Keep exploring history."],
    [0.00, "Keep learning — the world has so much to discover!"],
  ];
  const msg = msgs.find(([t]) => pct >= t)[1];

  document.getElementById("final-score").textContent = `${score} / ${ROUND_SIZE}`;
  document.getElementById("score-msg").textContent = msg;

  const list = document.getElementById("results-list");
  list.innerHTML = "";
  history.forEach(({ person, chosen, correct }) => {
    const cs = CAT[person.cat];
    const item = document.createElement("div");
    item.className = "res-item";
    item.innerHTML = `
      <div class="res-icon">${correct ? "✅" : "❌"}</div>
      <div>
        <div class="res-name">${person.name}</div>
        <div class="res-cat" style="color:${cs.color}">${cs.icon} ${person.cat}
          ${!correct ? ` &nbsp;·&nbsp; <span style="color:var(--muted)">You said: ${chosen.name}</span>` : ""}
        </div>
      </div>`;
    list.appendChild(item);
  });

  show("results-screen");
}

// ─────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────
function show(id) {
  ["start-screen", "quiz-screen", "results-screen"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}

// ─────────────────────────────────────────────
//  CATEGORY GRID ON START SCREEN
// ─────────────────────────────────────────────
(function buildCatGrid() {
  const el = document.getElementById("cat-grid");
  // Count people per category from the actual data
  const counts = {};
  PEOPLE.forEach(p => { counts[p.cat] = (counts[p.cat] || 0) + 1; });
  Object.entries(CAT).forEach(([name, s]) => {
    const card = document.createElement("div");
    card.className = "cat-card";
    card.style.borderTopColor = s.color;
    card.innerHTML =
      `<div class="cat-card-icon">${s.icon}</div>` +
      `<div class="cat-card-name">${name}</div>` +
      `<div class="cat-card-count">${counts[name] || 0} people</div>`;
    el.appendChild(card);
  });
})();

// ─────────────────────────────────────────────
//  EVENT LISTENERS
// ─────────────────────────────────────────────
document.getElementById("start-btn").addEventListener("click", startQuiz);
document.getElementById("next-btn").addEventListener("click", nextQuestion);
document.getElementById("restart-btn").addEventListener("click", () => {
  show("start-screen");
});
</script>
</body>
</html>
